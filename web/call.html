<!doctype html>
<!--
  Local web-call console for the Maya assistant.

  A browser call is the only way to speak to the assistant while the Vapi account
  holds no phone number, and the dashboard's own "Talk to Assistant" button hides
  the two things a demo has to show: the live transcript and the tool-call stream.
  This page shows both, and prints the Vapi call ID so the audit log can be
  grepped for the exact call afterwards.

    npm start                      # the tool server serves this page too
    http://localhost:3000/webcall

  localhost is a secure context, so the microphone works without TLS. The public
  key is stored in this browser's localStorage and is never written to the repo:
  public keys are designed to be exposed in client-side code, unlike the private
  key in .env, which must never reach a page.
-->
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Maya - web call console</title>
<style>
  :root { color-scheme: dark; --bg:#0f1115; --panel:#171a21; --line:#252a34; --ink:#e6e8ec; --dim:#9aa3b2; --ok:#4ade80; --warn:#fbbf24; --bad:#f87171; --acc:#60a5fa; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:14px/1.5 ui-sans-serif,system-ui,Segoe UI,sans-serif; }
  header { padding:14px 18px; border-bottom:1px solid var(--line); display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
  h1 { font-size:15px; margin:0 12px 0 0; font-weight:600; }
  input { background:#0b0d11; border:1px solid var(--line); color:var(--ink); padding:7px 9px; border-radius:6px; font:inherit; }
  input[size="44"] { min-width:260px; }
  button { border:0; border-radius:6px; padding:8px 16px; font:inherit; font-weight:600; cursor:pointer; }
  #start { background:var(--ok); color:#06240f; }
  #stop { background:var(--bad); color:#2b0606; }
  button:disabled { opacity:.4; cursor:not-allowed; }
  #status { margin-left:auto; color:var(--dim); font-variant-numeric:tabular-nums; }
  main { display:grid; grid-template-columns:1fr 1fr; gap:1px; background:var(--line); height:calc(100vh - 116px); }
  section { background:var(--panel); overflow-y:auto; padding:14px 16px; }
  h2 { font-size:11px; letter-spacing:.09em; text-transform:uppercase; color:var(--dim); margin:0 0 12px; font-weight:600; }
  .turn { margin-bottom:10px; }
  .who { font-size:11px; text-transform:uppercase; letter-spacing:.06em; color:var(--dim); }
  .maya .who { color:var(--acc); }
  .partial { opacity:.55; font-style:italic; }
  .ev { font-family:ui-monospace,Consolas,monospace; font-size:12px; padding:3px 0; border-bottom:1px solid #1e222a; white-space:pre-wrap; word-break:break-word; }
  .t-tool { color:var(--warn); }
  .t-err { color:var(--bad); }
  .t-life { color:var(--ok); }
  footer { padding:9px 18px; border-top:1px solid var(--line); color:var(--dim); font-family:ui-monospace,Consolas,monospace; font-size:12px; }
  code { color:var(--ink); }
</style>
</head>
<body>
<header>
  <h1>Maya - web call console</h1>
  <input id="key" type="password" size="30" placeholder="Vapi PUBLIC key" autocomplete="off" />
  <input id="assistant" size="44" placeholder="assistant id" />
  <button id="start">Start call</button>
  <button id="stop" disabled>End call</button>
  <span id="status">idle</span>
</header>
<main>
  <section><h2>Transcript</h2><div id="transcript"></div></section>
  <section><h2>Events and tool calls</h2><div id="events"></div></section>
</main>
<footer id="foot">Public key is kept in this browser only. Nothing here is written to the repo.</footer>
<script type="module">
import Vapi from "https://esm.sh/@vapi-ai/web@2.6.2";

const DEFAULT_ASSISTANT = "4d255930-3056-40b3-aa8e-bd31f4f608d3";
const $ = (id) => document.getElementById(id);
const keyBox = $("key");
const assistantBox = $("assistant");

keyBox.value = localStorage.getItem("vapi_public_key") || new URLSearchParams(location.search).get("key") || "";
assistantBox.value = localStorage.getItem("vapi_assistant") || new URLSearchParams(location.search).get("assistant") || DEFAULT_ASSISTANT;
keyBox.addEventListener("change", () => localStorage.setItem("vapi_public_key", keyBox.value.trim()));
assistantBox.addEventListener("change", () => localStorage.setItem("vapi_assistant", assistantBox.value.trim()));

function event(text, kind = "") {
  const row = document.createElement("div");
  row.className = `ev ${kind}`;
  row.textContent = `${new Date().toLocaleTimeString("en-GB")}  ${text}`;
  $("events").append(row);
  $("events").scrollTop = $("events").scrollHeight;
}

// One node per speaker turn, rewritten while the transcript is partial and frozen
// when the final arrives, so the pane reads like a conversation rather than a
// stream of fragments.
let open = null;
function transcribe(role, text, final) {
  const who = role === "assistant" ? "Maya" : "You";
  if (!open || open.role !== role) {
    const node = document.createElement("div");
    node.className = `turn ${role === "assistant" ? "maya" : ""}`;
    node.innerHTML = `<div class="who"></div><div class="said"></div>`;
    node.querySelector(".who").textContent = who;
    $("transcript").append(node);
    open = { role, node };
  }
  const said = open.node.querySelector(".said");
  said.textContent = text;
  said.className = final ? "said" : "said partial";
  if (final) open = null;
  $("transcript").scrollTop = $("transcript").scrollHeight;
}

let vapi = null;

$("start").addEventListener("click", async () => {
  const key = keyBox.value.trim();
  const assistant = assistantBox.value.trim();
  if (!key || !assistant) {
    event("public key and assistant id are both required", "t-err");
    return;
  }
  localStorage.setItem("vapi_public_key", key);
  localStorage.setItem("vapi_assistant", assistant);

  $("start").disabled = true;
  $("status").textContent = "checking microphone...";

  // Prove the input device works before opening a call. Vapi tears down a web
  // call after a few seconds of true silence and the browser surfaces that as
  // {"type":"no-room","msg":"Exiting meeting because room was deleted"}, which
  // looks like a broken assistant but is really a blocked or missing mic - the
  // call's endedReason is error-assistant-did-not-receive-customer-audio. Fail
  // here instead, with the reason named.
  try {
    const probe = await navigator.mediaDevices.getUserMedia({ audio: true });
    const label = probe.getAudioTracks()[0]?.label || "default input";
    probe.getTracks().forEach((track) => track.stop());
    event(`microphone ok - ${label}`, "t-life");
  } catch (err) {
    const hints = {
      NotAllowedError: "permission denied - open the padlock in the address bar, allow the microphone, reload",
      NotFoundError: "no input device - check Windows Settings > System > Sound > Input",
      NotReadableError: "device held by another app - close Zoom, Teams, OBS or Loom and retry",
      OverconstrainedError: "the device rejected the request - choose a different input in Windows sound settings",
      SecurityError: "insecure context - reach this page over localhost or https, not a LAN IP",
    };
    $("start").disabled = false;
    $("status").textContent = "no microphone";
    event(`microphone unavailable (${err?.name || "error"}): ${hints[err?.name] || err?.message || "check browser permission and the Windows input device"}`, "t-err");
    return;
  }

  $("status").textContent = "connecting...";
  vapi = new Vapi(key);

  vapi.on("call-start", () => {
    $("stop").disabled = false;
    $("status").textContent = "live";
    event("call-start", "t-life");
  });

  vapi.on("call-end", () => {
    $("start").disabled = false;
    $("stop").disabled = true;
    $("status").textContent = "ended";
    event("call-end", "t-life");
  });

  vapi.on("speech-start", () => event("maya speaking"));
  vapi.on("speech-end", () => event("maya done"));
  vapi.on("error", (err) => event(`error ${JSON.stringify(err?.error ?? err?.message ?? err)}`, "t-err"));

  vapi.on("message", (msg) => {
    if (msg.type === "transcript") {
      transcribe(msg.role, msg.transcript, msg.transcriptType === "final");
      return;
    }
    // Tool calls are the whole point of watching this pane: the auth lock is
    // visible as get_account_details arriving only after verify_customer.
    if (msg.type === "tool-calls") {
      for (const call of msg.toolCalls || msg.toolCallList || []) {
        const name = call.name || call.function?.name || "?";
        const args = call.arguments ?? call.function?.arguments ?? {};
        event(`tool -> ${name} ${typeof args === "string" ? args : JSON.stringify(args)}`, "t-tool");
      }
      return;
    }
    if (msg.type === "tool-calls-result" || msg.type === "tool_call_result") {
      event(`tool <- ${JSON.stringify(msg.toolCallResult ?? msg)}`, "t-tool");
      return;
    }
    if (msg.type === "status-update") event(`status ${msg.status}${msg.endedReason ? ` (${msg.endedReason})` : ""}`, "t-life");
  });

  try {
    const call = await vapi.start(assistant);
    const id = call?.id || "(id not returned)";
    event(`call id ${id}`, "t-life");
    $("foot").innerHTML = `call id <code>${id}</code> &nbsp;-&nbsp; audit: <code>node scripts/tail_audit.mjs ${id}</code>`;
  } catch (err) {
    $("start").disabled = false;
    $("status").textContent = "failed";
    event(`start failed: ${err?.message || err}`, "t-err");
  }
});

$("stop").addEventListener("click", () => vapi?.stop());

</script>
</body>
</html>
